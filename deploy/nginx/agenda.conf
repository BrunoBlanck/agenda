# Agenda multi-loja: nginx de produção na frente do build do front e da API (GER-29).
#
# Mapa de URLs (o servidor de dev do front, frontend/vite.config.js, segue o mesmo mapa):
#   /_app/...                         arquivos do build do front (/var/www/agenda), cache longo
#   /superadmin, /superadmin/...      SPA (index.html)
#   /<slug>/painel, /<slug>/painel/...  SPA (index.html)
#   /api/... e todo o resto           back-end (uvicorn em 127.0.0.1:8000): API, site da loja (/<slug>), 404
#
# Instalação: deploy/README.md. Copie para /etc/nginx/conf.d/agenda.conf (ou sites-available) e
# rode "nginx -t && systemctl reload nginx".
#
# Atenção: add_header dentro de um location anula TODOS os add_header herdados do server. Por isso os
# cabeçalhos de segurança estão repetidos em cada location que serve arquivo do front. As respostas
# do back-end (location / e /api/) já trazem os próprios cabeçalhos (CSP das páginas HTML, logo).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 3m;          # logo: até 2 MB (LOGO_TAMANHO_MAXIMO) + folga do multipart

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    # text/html já é comprimido sempre (repetir aqui gera aviso no nginx -t)
    gzip_types application/javascript text/javascript text/css application/json image/svg+xml;

    # Repassados ao back-end. X-Forwarded-For é SOBRESCRITO com o IP de quem conectou no nginx (não
    # acrescenta ao que o cliente mandou): o cliente não consegue forjar o IP da auditoria nem fugir
    # do limite de requisições. O uvicorn só confia nesses cabeçalhos vindos de FORWARDED_ALLOW_IPS.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Build do front (vite build com base '/_app/') -------------------------------------------
    # Só /_app/assets/ tem hash no nome: pode ficar em cache por 1 ano (immutable).
    location ^~ /_app/assets/ {
        alias /var/www/agenda/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # O resto de /_app/ (favicon e outros arquivos de public/, sem hash): cache curto.
    location ^~ /_app/ {
        alias /var/www/agenda/;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
    }

    # O index.html não pode ficar no cache longo de /_app/ (ele aponta para os arquivos da versão atual)
    location = /_app/index.html {
        root /var/www/agenda;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /_app/ {
        root /var/www/agenda;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # --- SPA: SUPERADMIN e painel da loja (o React Router cuida do resto do caminho) --------------
    location = /superadmin {
        root /var/www/agenda;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ^~ /superadmin/ {
        root /var/www/agenda;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # /<slug>/painel e /<slug>/painel/... (slug: minúsculas, números e hífens; PLA-16)
    location ~ ^/[a-z0-9]+(-[a-z0-9]+)*/painel(/|$) {
        root /var/www/agenda;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    # --- Back-end ----------------------------------------------------------------------------------
    # /api/ com ^~: nenhuma rota da API cai na regex do painel acima (ex.: /api/painel).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # Site da loja (/<slug>), páginas 404 do back-end (/, /painel) e o que mais não casar acima.
    location / {
        proxy_pass http://127.0.0.1:8000;
    }

    # HTTPS (futuro): certbot --nginx -d seu.dominio (ver deploy/README.md). Depois de ligar o HTTPS,
    # o X-Forwarded-Proto passa a ser "https" sozinho ($scheme).
}
